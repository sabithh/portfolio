<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mohammed Sabith Logo Drafts</title>
    <style>
      :root {
        --bg: #f3efe1;
        --ink: #1a1600;
        --card: #efe8d2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 24px;
        opacity: 0.8;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .card {
        margin: 0;
        padding: 14px;
        border: 1px solid var(--ink);
        background: var(--card);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        background: #f3efe1;
        border: 1px solid rgba(26, 22, 0, 0.25);
      }

      figcaption {
        margin-top: 10px;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h1>Logo Drafts: Mohammed Sabith</h1>
    <p>Preview only. Not wired to the live site.</p>

    <section class="grid">
      <figure class="card">
        <img src="./ms-logo-draft-01.svg" alt="Draft 01" />
        <figcaption>Draft 01</figcaption>
      </figure>

      <figure class="card">
        <img src="./ms-logo-draft-02.svg" alt="Draft 02" />
        <figcaption>Draft 02</figcaption>
      </figure>

      <figure class="card">
        <img src="./ms-logo-draft-03.svg" alt="Draft 03" />
        <figcaption>Draft 03</figcaption>
      </figure>

      <figure class="card">
        <img src="./ms-logo-draft-s.svg" alt="Draft S" />
        <figcaption>Draft S</figcaption>
      </figure>

      <figure class="card">
        <img src="./ms-logo-draft-s-inside.svg" alt="Draft S Inside" />
        <figcaption>Draft S Inside</figcaption>
      </figure>
    </section>
  </body>
</html>
